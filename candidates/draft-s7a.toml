# candidates/draft-s7.toml の配置に、config/optimize.toml の overridable（ゐ を譲る）を足したもの

[meta]
name = "draft-s7a"
version = "0.0.0"

[prefix]
keys = ["d", "k"]
solo = { "k" = "、", "d" = "。" }

[layers.base]
rows = [
  "も こ の と ま ら ん な お ー 「 」",
  "を い _ か は て た _ し き す",
  "ゃ く に ょ ゅ る う っ あ つ",
]

[layers.d]
rows = [
  "ぽ ご ぴ ど ぱ む ひ ち け ぅ _ _",
  "ぼ ぶ ざ が ば ！ り そ れ や ぃ",
  "_ ぐ ぺ ぜ _ へ ろ ぬ ぇ ぉ",
]

[layers.k]
rows = [
  "_ ね み わ ぁ ぷ び ぢ げ _ _ _",
  "ほ ふ さ よ え で だ ぞ じ ぎ ず",
  "？ _ め せ ゆ べ ゔ _ _ づ",
]

[shift_omission]
units = ["き", "し", "ち", "に", "ひ", "み", "り"]
triggers = ["ゃ", "ゅ", "ょ"]
postfix = true
overridable = ["ゐ"]

[[postfix]]
trigger = "ゃ"
[postfix.rules]
"て" = "てぃ"
"で" = "でぃ"
"せ" = "すぃ"
"ぜ" = "ずぃ"
"え" = "うぃ"
"へ" = "ふぃ"
"け" = "くぃ"
"げ" = "ぐぃ"
"と" = "つぃ"
"ふ" = "ふぁ"
"つ" = "つぁ"
"く" = "くぁ"
"ぐ" = "ぐぁ"
"ゔ" = "ゔぁ"
"「" = "『"
"」" = "』"
"ー" = "…"
"わ" = "ゎ"
"い" = "ゐ"

[[postfix]]
trigger = "ょ"
[postfix.rules]
"て" = "ちぇ"
"で" = "ぢぇ"
"せ" = "しぇ"
"ぜ" = "じぇ"
"え" = "うぇ"
"へ" = "ふぇ"
"け" = "くぇ"
"げ" = "ぐぇ"
"と" = "つぇ"
"い" = "いぇ"
"ふ" = "ふぉ"
"つ" = "つぉ"
"く" = "くぉ"
"ぐ" = "ぐぉ"
"う" = "うぉ"
"ゔ" = "ゔぉ"

[[postfix]]
trigger = "ゅ"
[postfix.rules]
"つ" = "とぅ"
"づ" = "どぅ"
"「" = "（"
"」" = "）"
"ー" = "‥"
"え" = "ゑ"
"く" = "くゎ"
"ぐ" = "ぐゎ"

[[postfix]]
trigger = "い"
[postfix.rules]
"ゔ" = "ゔぃ"

[[postfix]]
trigger = "え"
[postfix.rules]
"ゔ" = "ゔぇ"
