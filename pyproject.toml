[project]
name = "izayoi"
version = "0.1.0"
description = "十六夜配列: 前置シフト + 後置シフトのかな配列と、その AutoHotkey 実装ジェネレーター"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fugashi[unidic-lite]>=1.5.2",
    "numpy>=2.5.4",
]

[project.scripts]
izayoi = "izayoi.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
