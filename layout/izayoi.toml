# 十六夜配列 定義ファイル
#
# 各レイヤーは 3 段の格子で書く。トークンは空白区切り。
# 対応するキーの位置（US 配列）:
#   上段: q w e r t y u i o p [ ]   （12 キー）
#   中段: a s d f g h j k l ; '     （11 キー）
#   下段: z x c v b n m , . /       （10 キー）
# 基本は [ ] を除く 31 キー。[ ] は約物にだけ使う。
# "_" は割り当てなしを表す。複数文字のトークン（例: "きゃ"）も書ける。
#
# candidates/draft-s21.toml を採用したもの（2026-11-07）。
# 外来音・古語・記号の打ち方は 2026-11-04 に draft-s17 で決めたもの。K＋, にあった 、 は、ぞ が来たので K＋' に移した。
# 記号は、通常面・シフト面の文字＋拗音キーの後置シフトで出す（ゃ＝前、ょ＝次、ゅ＝代替）。
# [ ] と数字キーは使わない（IME にそのまま渡す。[ ] で「」を打てる）。

[meta]
name = "十六夜配列"
version = "0.1.0"

# 前置シフト: ここに書いたキーを先に押し、続けて押したキーで
# layers.<キー名> の文字を出す。base レイヤーの同じ位置は "_" にしておく。
# シフトキーと反対の手のキー（異手シフト）に通常のシフト面の文字を、
# 同じ手のキー（同手シフト）に濁音・半濁音を置く（原則）。
[prefix]
keys = ["d", "k"]
solo = { "k" = "、", "d" = "。" }

[layers.base]
rows = [
  "も こ の あ ま つ た な っ ー _ _",
  "を い _ か と ん て _ し く お",
  "ゃ ょ に は ゅ る う そ き す",
]

[layers.d]
rows = [
  "ぽ ご ぴ ぼ ぱ ゎ り ち め ぃ _ _",
  "ぶ ざ ぜ が ど ひ ら け れ え _",
  "゜ ゛ 。 ば ぷ へ ゆ ！ ぁ ぇ",
]

[layers.k]
rows = [
  "ぉ や み ほ ね づ だ ぢ ぺ _ _ _",
  "ふ さ せ ろ わ び で げ じ ぐ 、",
  "ぅ ぬ ？ よ む べ ゔ ぞ ぎ ず",
]

# シフト省略: シフト面にある units の文字は、triggers の直前ではシフトを省略して打てる
# （例: D＋H が ひ、H が ん なら、H＋ゃ で ひゃ）。
# postfix = true: triggers の後置シフトの規則でも、直前の文字のシフトを省略できる（例: K＋A が ふ、A が を なら、A＋ゃ で ふぁ）
# 同じキーの通常面を 2 つの規則が取り合うときは、先に書いた規則が優先される（へ と べ では へ）。
[shift_omission]
units = ["き", "し", "ち", "に", "ひ", "み", "り"]
triggers = ["ゃ", "ゅ", "ょ"]
postfix = true

# 後置シフト: 直前に出した文字の直後にトリガーの文字を打つと、
# 2 文字の組み合わせを別の文字に置き換える（外来音・記号・古語）。
# [[postfix]] ごとに trigger と、rules に「直前の文字 = 置き換え後」を並べる。
# ここに書いていない組み合わせ（例: き + ゃ）は、そのまま「きゃ」になる。
# 記号は ゃ＝前、ょ＝次、ゅ＝代替 にそろえる。
# げ＋ゃ／ょ／ゅ は小書きの ゃ ょ ゅ だけを出す（規則のある文字の直後に小書きを打つため）。
[[postfix]]
trigger = "ゃ"
[postfix.rules]
# 外来音・古語
"て" = "てぃ"
"で" = "でぃ"
"こ" = "くぃ"
"ご" = "ぐぃ"
"と" = "つぃ"
"ど" = "づぃ"
"お" = "うぃ"
"へ" = "ふぃ"
"べ" = "ゔぃ"
"う" = "いぇ"
"す" = "すぃ"
"ず" = "ずぃ"
"ふ" = "ふぁ"
"は" = "ふぁ"
"つ" = "つぁ"
"く" = "くぁ"
"ぐ" = "ぐぁ"
"ゔ" = "ゔぁ"
"げ" = "ゃ"
# 記号
"も" = "□"
"ぽ" = "◇"
"あ" = "○"
"ま" = "△"
"ぱ" = "▽"
"い" = "☆"
"か" = "←"
"が" = "↑"
"ゎ" = "；"
"っ" = "「"
"め" = "【"
"ぺ" = "『"
"ー" = "－"
"そ" = "‥‥"

[[postfix]]
trigger = "ょ"
[postfix.rules]
# 外来音・古語
"て" = "ちぇ"
"で" = "ぢぇ"
"こ" = "くぇ"
"ご" = "ぐぇ"
"と" = "つぇ"
"ど" = "づぇ"
"お" = "うぇ"
"へ" = "ふぇ"
"べ" = "ゔぇ"
"う" = "うぉ"
"す" = "しぇ"
"ず" = "じぇ"
"ふ" = "ふぉ"
"は" = "ふぉ"
"つ" = "つぉ"
"く" = "くぉ"
"ぐ" = "ぐぉ"
"ゔ" = "ゔぉ"
"げ" = "ょ"
# 記号
"も" = "■"
"ぽ" = "◆"
"あ" = "●"
"ま" = "▲"
"ぱ" = "▼"
"い" = "★"
"か" = "→"
"が" = "↓"
"ゎ" = "’"
"っ" = "」"
"め" = "】"
"ぺ" = "』"
"ー" = "―"
"そ" = "……"

[[postfix]]
trigger = "ゅ"
[postfix.rules]
# 外来音・古語
"と" = "とぅ"
"ど" = "どぅ"
"ふ" = "ふゅ"
"う" = "ゐ"
"お" = "ゑ"
"く" = "くゎ"
"ぐ" = "ぐゎ"
"げ" = "ゅ"
# 記号
"あ" = "◎"
"い" = "×"
"か" = "⇒"
"が" = "⇔"
"。" = "．"
"、" = "，"
"っ" = "・"
"め" = "／"
"ぺ" = "※"
"ー" = "～"
