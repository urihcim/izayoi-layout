# 運指コストの重み
#
# 評価値は「1 打鍵ごとのキーの負担」と「連続する 2 打鍵の組み合わせの負担」の合計。
# 値は相対的なものなので、配列どうしの比較にだけ使う。

# キーごとの負担（3 段 × 10 キー、QWERTY の位置）
# 1 打鍵には最低限の時間がかかるので、最も打ちやすいキーを 1.0 とし、差を付けすぎない。
# 小指（Q A Z / P ; ' /）は重くし、頻度の高い文字が小指に集まらないようにする（小指に置かない文字を
# 制約で決めず、コストで決める）。; は人差し指を横に伸ばす G H（1.4）より重い 2.0。以前の ; 1.6、' 2.2、
# P 2.2 では、制約なしだと な が A、は が ;、く が ' に来て、左小指が 4.6% に増えた。今の値（0.4 重い）で
# 制約なしに探すと、制約があったときとほぼ同じ配置になる。
# 左小指（Q A Z）は、同じ段の右小指（P ; /）より 0.1 重くし、左小指を右小指より少なくする。
# 右小指は 「 」 の [ ] も受け持つので、左小指より多くてよい。
# Y は 2.0 にする。ロウスタッガードでは J から 1.25 キー左上に伸ばすことになり、右人差し指で最も遠い
# （H は 1 キー、N は 0.5 キー）。1.8 では く（2.1%）が Y に来て、伸ばしがつらかった（draft-s16）。
# 右利きに合わせて、左手のキーは上の考え方で決めた値より一律 0.1 重くする。
# 上段: q w e r t y u i o p [ ] / 中段: a s d f g h j k l ; ' / 下段: z x c v b n m , . /
effort = [
  "2.8 1.6 1.3 1.4 1.8   2.0 1.3 1.2 1.5 2.6 2.5 3.0",
  "2.2 1.2 1.1 1.1 1.5   1.4 1.0 1.0 1.1 2.0 2.6",
  "2.8 1.9 1.6 1.4 2.0   1.5 1.2 1.5 1.8 2.6",
]
# 1 打鍵ごとの固定の負担。上の effort と effort_extra のすべてのキーに足す。
# キーの打ちやすさの差に比べて打鍵数を重く見るための値で、0 だと前置シフト（D/K＋ホーム段 = 2.0）が
# 通常面の打ちにくいキー（P = 2.0、Z = 2.2）と同じ扱いになり、打鍵数が増える（打鍵/かな 1.35）。
# 0.5 以上では打鍵/かなが 1.32 前後で頭打ちになるので、キーの負担の差を残せる最小の 0.5 にする。
stroke = 0.5

# 上記以外のキーの負担
# space は D/K を単独で押した後の確定系のキー（親指）。
# "-" "?" "!" はローマ字入力の比較用で、"?" と "!" は Shift との同時押しを含めた値。
[effort_extra]
space = 1.0
"-" = 2.5
"?" = 3.2
"!" = 3.5

[bigram]
same_key = 0.3          # 同じキーの連打
sfb = 1.5               # 同じ指で別のキーを打つ
sfb_per_row = 0.5       # 同じ指の連続で、段が 1 つ離れるごとの追加分
same_hand = 0.1         # 同じ手で別の指（下記に当てはまらない場合）
scissor = 0.8           # 同じ手で上段と下段をまたぐ
roll_in = -0.2          # 同じ手・同じ段で、小指側から人差し指側へ流れる
roll_out = 0.0          # 同じ手・同じ段で、人差し指側から小指側へ流れる

# ロウスタッガード（普通のキーボード）の段のずれ
# offset: 上段・中段・下段の横のずれ（キー幅単位、右が正）。上段は中段より 1/4 キー左、下段は 1/2 キー右。
# cramp: 同じ手の別の指で段をまたぐとき、ずれで 2 つのキーの横の間隔が 1 キーに満たなくなる分 × この値を
#   2 打鍵の負担に足す（例: D→X は 0.5 キー、D→R は 0.25 キー近づき窮屈。D→W は離れるので足さない）。
[stagger]
offset = [-0.25, 0.0, 0.5]
cramp = 2.0
