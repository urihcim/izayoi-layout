# 配列生成（最適化）の設定
#
# ここで決めた「配置する文字」「後置シフトの規則」「配置の制約」を前提に、
# 文字をどのキーに置くかを焼きなまし法で探す。
#
# キーは US 配列の位置で、各面に次の 33 キーがある。
#   上段: q w e r t y u i o p [ ]   中段: a s d f g h j k l ; '   下段: z x c v b n m , . /
# 31 キーを使う。[ ] は使わない（下の constraints.reserved）。

[prefix]
keys = ["d", "k"]
# D/K を単独で押し、確定系のキー（スペース・Enter など）を続けたときにも文字を出す
solo = true

# 後置シフトの規則
# 直前の文字の後にトリガーを打つと、2 文字を置き換える。layout/izayoi.toml と同じ書式で、
# [[postfix]] ごとに trigger（トリガー）と rules（「直前の文字 = 置き換え後」）を書く。
# 拗音は規則を使わず、そのまま打つ（き＋ゃ＝きゃ）。規則は、日本語に現れない並び
# （ふゃ、とょ など）だけに作り、打った並びはなるべくそのまま残す（ゔ＋ゅ＝ゔゅ）。
# ここには外来音・古語の規則だけを書く。記号の規則は配置が決まってから配列定義に書く。
#
# トリガーは拗音キー（ゃ ゅ ょ）で、おおむね次の対応にそろえる。
#   ゃ → ァ・ィ    ょ → ェ・ォ    ゅ → ゥ・ュ・ゎ・古語
#   （く→くぁ/くぉ/くゎ、こ→くぃ/くぇ、つ→つぁ/つぉ、と→つぃ/つぇ/とぅ、て→てぃ/ちぇ、
#     ふ・は→ふぁ/ふぉ、へ→ふぃ/ふぇ、お→うぃ/うぇ/ゑ、う→いぇ/うぉ/ゐ、す→すぃ/しぇ、
#     ゔ→ゔぁ/ゔぉ、べ→ゔぃ/ゔぇ）
# 濁音にも清音と同じ規則を付ける（で＋ゃ→でぃ など。濁音が 2 打なので 3 打になる）。

[[postfix]]
trigger = "ゃ"
[postfix.rules]
"て" = "てぃ"
"で" = "でぃ"
"こ" = "くぃ"
"ご" = "ぐぃ"
"と" = "つぃ"
"ど" = "づぃ"
"お" = "うぃ"
"へ" = "ふぃ"
"べ" = "ゔぃ"
"う" = "いぇ"
"す" = "すぃ"
"ず" = "ずぃ"
"ふ" = "ふぁ"
"は" = "ふぁ"
"つ" = "つぁ"
"く" = "くぁ"
"ぐ" = "ぐぁ"
"ゔ" = "ゔぁ"

[[postfix]]
trigger = "ょ"
[postfix.rules]
"て" = "ちぇ"
"で" = "ぢぇ"
"こ" = "くぇ"
"ご" = "ぐぇ"
"と" = "つぇ"
"ど" = "づぇ"
"お" = "うぇ"
"へ" = "ふぇ"
"べ" = "ゔぇ"
"う" = "うぉ"
"す" = "しぇ"
"ず" = "じぇ"
"ふ" = "ふぉ"
"は" = "ふぉ"
"つ" = "つぉ"
"く" = "くぉ"
"ぐ" = "ぐぉ"
"ゔ" = "ゔぉ"

[[postfix]]
trigger = "ゅ"
[postfix.rules]
"と" = "とぅ"
"ど" = "どぅ"
# 並びはそのまま。シフト面の ふ をシフト省略で打つための規則（D＋; が ふ なら ;＋ゅ で ふゅ）
"ふ" = "ふゅ"
"う" = "ゐ"
"お" = "ゑ"
"く" = "くゎ"
"ぐ" = "ぐゎ"

# シフト省略（拗音用）
# シフト面にある units の文字は、triggers の直前ではシフトを省略して打てる
# （例: D＋; が に、; が ま なら、;＋ゃ で にゃ）。拗音はどれも 2 打になる。
# そのため units の文字は、同じキーの通常面に units 以外の文字があるシフト面にしか置けない
# （最適化では守れない配置に大きなペナルティを付けて避ける）。
# この規則と重なる後置シフト（外来音など）は無効になる。
#
# postfix = true にすると、triggers の後置シフトの規則でも、直前の文字がシフト面にあれば
# シフトを省略できる（例: D＋; が ふ、; が れ なら、;＋ゃ で ふぁ。シフトを付けても打てる）。
# 同じキーの通常面の文字に、その拗音キーの規則がある、または い段（units）のときは省略できない。
# 同じキーの通常面を、units の文字とほかの規則の直前の文字が取り合うときは、units の文字、
# 次に上で先に書いた規則を優先する（それ以外はシフトを付けて打つ）。
# preferred の文字を出す規則は、シフトを省略して 2 打で打てる配置にする（守れない配置には
# 大きなペナルティを付けて避ける）。規則の直前の文字を通常面に置くか、シフト面に置いて同じキーの
# 通常面に規則のない文字を置く。ほかの規則（ゐ など）を消さずに、よく使う外来音を優先する。
# overridable に書いた文字を出す規則は、シフト省略に譲る（例: D＋; が ふ、; が い なら、
# ;＋ゃ は ゐ でなく ふぁ になり、ゐ は打てなくなる）。今は使わない。
[shift_omission]
units = ["き", "し", "ち", "に", "ひ", "み", "り"]
triggers = ["ゃ", "ゅ", "ょ"]
postfix = true
preferred = ["ふぁ", "ふぃ", "ふぇ", "ふぉ", "ふゅ"]

[optimize]
iterations = 600000  # 1 回の探索の試行回数（20 万回では seed ごとの差が大きい）
restarts = 4         # 初期配置を変えて探索する回数
seed = 0

# キーに置く文字
units = [
  # 清音・撥音
  "あ", "い", "う", "え", "お",
  "か", "き", "く", "け", "こ",
  "さ", "し", "す", "せ", "そ",
  "た", "ち", "つ", "て", "と",
  "な", "に", "ぬ", "ね", "の",
  "は", "ひ", "ふ", "へ", "ほ",
  "ま", "み", "む", "め", "も",
  "や", "ゆ", "よ",
  "ら", "り", "る", "れ", "ろ",
  "わ", "を", "ん",
  # 小書き
  "ゃ", "ゅ", "ょ", "っ",
  "ぁ", "ぃ", "ぅ", "ぇ", "ぉ",
  # 濁音・半濁音
  "が", "ぎ", "ぐ", "げ", "ご",
  "ざ", "じ", "ず", "ぜ", "ぞ",
  "だ", "ぢ", "づ", "で", "ど",
  "ば", "び", "ぶ", "べ", "ぼ",
  "ぱ", "ぴ", "ぷ", "ぺ", "ぽ",
  "ゔ",
  # 長音・約物（「 」 は IME に渡す [ ] で打つので置かない）
  "ー", "、", "。", "？", "！",
]

# 配置の制約
#
# 場所は「セレクター」を空白で区切って書く。
#   面: base / d / k / solo（D/K の単独打鍵）     段: top / home / bottom     手: left / right
#   指: index / middle / ring / pinky（左右両方）    キー: @jkl（列挙したキーのどれか）
#   シフト: same（同手シフト: シフトキーと同じ手のキー）/ cross（異手シフト: 反対の手のキー）
# 同じ種類のセレクターは「または」、違う種類は「かつ」でつなぐ。
# 先頭に ! を付けたセレクターに当てはまる場所は除く。
#   例: "base home" = 通常面のホーム段、"right !pinky" = 右手の小指以外、
#       "d @jkl;" = D 面の j k l ;、"same" = D＋左手のキー と K＋右手のキー
# 1 つの規則に場所をリストで複数書くと、そのどれかに置ける。
[constraints]
# 空けておく場所（将来の拡張用など）
# [ ] は使わない（IME にそのまま渡す。[ ] で「」を打てる）
reserved = ["@[]"]
# reserved = ["base @t", "d @q"]

# 特定の位置に固定する（場所はちょうど 1 キーに当てはまるように書く）
[constraints.pinned]

# 専用の場所: area には units の文字しか置けない
# 原則 1: 同手シフトは濁音・半濁音専用（異手シフトが通常のシフト面の文字）
[[constraints.exclusive]]
area = ["same"]
units = [
  "が", "ぎ", "ぐ", "げ", "ご", "ざ", "じ", "ず", "ぜ", "ぞ",
  "だ", "ぢ", "づ", "で", "ど", "ば", "び", "ぶ", "べ", "ぼ",
  "ぱ", "ぴ", "ぷ", "ぺ", "ぽ", "ゔ",
]

# 原則 2: D/K の単独打鍵は句読点専用
[[constraints.exclusive]]
area = ["solo"]
units = ["、", "。"]

# 置ける場所の制限（in: ここにだけ置ける / not_in: ここには置かない）
# 同じ文字に複数の規則が当てはまる場合は、すべてを満たす場所に置く。
# 原則 1: 濁音・半濁音は同手シフトに置く
[[constraints.area]]
units = [
  "が", "ぎ", "ぐ", "げ", "ご", "ざ", "じ", "ず", "ぜ", "ぞ",
  "だ", "ぢ", "づ", "で", "ど", "ば", "び", "ぶ", "べ", "ぼ",
  "ぱ", "ぴ", "ぷ", "ぺ", "ぽ", "ゔ",
]
in = ["same"]

# 原則 2: 句読点は D/K の単独打鍵に置く（、と 。のどちらを D にするかは最適化で決める）
[[constraints.area]]
units = ["、", "。"]
in = ["solo"]

# 拗音・促音・撥音・長音は通常面に置く
# （ゃゅょ は「きゃ」などを 2 打で打てるように。ー は青空文庫では外来語が少なく
#   頻度が低く出るため、評価に任せない）
[[constraints.area]]
units = ["ゃ", "ゅ", "ょ", "っ", "ん", "ー"]
in = ["base"]

# 小指に置く文字は制約で決めず、小指の負担（config/cost.toml）で決める

# 頻度の高い文字（青空文庫で 2% 以上の清音・撥音・促音）は通常面に置く
# （コストだけでは は や こ がシフト面に来ることがある。draft-s9 で は、draft-s10 で こ）
[[constraints.area]]
units = [
  "い", "う", "の", "し", "ん", "た", "か", "と", "に", "な", "て", "は",
  "く", "っ", "こ",
]
in = ["base"]

# す は通常面に置く（シフトなしで打ちたい）
[[constraints.area]]
units = ["す"]
in = ["base"]

# ' には濁音・半濁音と組にならない文字を置く（K＋' の濁音は ' を小指で伸ばしたまま打つことになり、
# 打ちにくい。draft-s17 で く を ' に置き、ぐ が K＋' になった）
# 通常面と D 面（異手シフト）の ' に置いた文字の濁音は、K＋' に置かれる。
[[constraints.area]]
units = [
  "う", "か", "き", "く", "け", "こ", "さ", "し", "す", "せ", "そ",
  "た", "ち", "つ", "て", "と", "は", "ひ", "ふ", "へ", "ほ",
  "ま", "み", "む", "め", "も",
]
not_in = ["base @'", "d @'"]


# 清音とそろえる: 左の文字を、右の文字と同じキーの同手シフトに置く
# （右の文字が D 面・K 面・通常面のどこにあっても、そのキーを D＋左手 / K＋右手で打つ）
# 例外を作るときは、その行を消す（消した文字は同手シフトの中で自由に置かれる）。
[constraints.aligned]
"が" = "か"
"ぎ" = "き"
"ぐ" = "く"
"げ" = "け"
"ご" = "こ"
"ざ" = "さ"
"じ" = "し"
"ず" = "す"
"ぜ" = "せ"
"ぞ" = "そ"
"だ" = "た"
"ぢ" = "ち"
"づ" = "つ"
"で" = "て"
"ど" = "と"
"ば" = "は"
"び" = "ひ"
"ぶ" = "ふ"
"べ" = "へ"
"ぼ" = "ほ"
"ぱ" = "ま"
"ぴ" = "み"
"ぷ" = "む"
"ぺ" = "め"
"ぽ" = "も"
"ゔ" = "う"

# 例: 括弧は右手、小指以外
# [[constraints.area]]
# units = ["「", "」"]
# in = ["right !pinky"]
#
# 例: 小書きの母音は下段か前置シフト面に
# [[constraints.area]]
# units = ["ぁ", "ぅ", "ぇ", "ぉ"]
# in = ["bottom", "d", "k"]
