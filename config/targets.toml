# 打鍵数の目標
#
# items の文字列を max_strokes 打以内で打てるかを、`izayoi eval --targets` で確かめる。
# 濁音・半濁音は前置シフトで二打なので、それを含むものは三打まで許容する。
# カタカナで書いてもよい（ひらがなに直して扱う）。

[[group]]
name = "拗音（清音）"
priority = "必須"
max_strokes = 2
items = [
  "きゃ", "きゅ", "きょ", "しゃ", "しゅ", "しょ", "ちゃ", "ちゅ", "ちょ",
  "にゃ", "にゅ", "にょ", "ひゃ", "ひゅ", "ひょ", "みゃ", "みゅ", "みょ",
  "りゃ", "りゅ", "りょ",
]

[[group]]
name = "拗音（濁音・半濁音）"
priority = "必須"
max_strokes = 3
items = [
  "ぎゃ", "ぎゅ", "ぎょ", "じゃ", "じゅ", "じょ", "ぢゃ", "ぢゅ", "ぢょ",
  "びゃ", "びゅ", "びょ", "ぴゃ", "ぴゅ", "ぴょ",
]

[[group]]
name = "外来音（清音・優先）"
priority = "高"
max_strokes = 2
items = ["ファ", "フィ", "フェ", "フォ", "フュ"]

[[group]]
name = "外来音（清音）"
priority = "中"
max_strokes = 2
items = [
  "ツァ", "ツィ", "ツェ", "ツォ",
  "ウィ", "ウェ", "ウォ", "イェ",
  "シェ", "チェ", "ティ", "テュ", "トゥ", "スィ",
  "クァ", "クィ", "クェ", "クォ",
]

[[group]]
name = "外来音（濁音）"
priority = "中"
max_strokes = 3
items = [
  "ヴァ", "ヴィ", "ヴ", "ヴェ", "ヴォ", "ヴュ",
  "ジェ", "ヂェ", "ディ", "デュ", "ドゥ", "ズィ",
  "グァ", "グィ", "グェ", "グォ",
]

[[group]]
name = "古語（清音）"
priority = "低"
max_strokes = 2
items = ["くゎ", "ゐ", "ゑ"]

[[group]]
name = "古語（濁音）"
priority = "低"
max_strokes = 3
items = ["ぐゎ"]

[[group]]
name = "記号"
priority = ""
max_strokes = 2
items = ["「", "」", "……", "‥‥", "？", "！", "・"]

[[group]]
name = "記号（追加）"
priority = ""
max_strokes = 3
items = [
  "『", "』", "【", "】", "←", "↓", "↑", "→", "⇔", "⇒", "※", "～", "―", "－", "／",
  "★", "☆", "×", "●", "○", "◎", "■", "□", "◆", "◇", "▲", "△", "▼", "▽",
  "；", "’", "．", "，", "゛", "゜",
]
